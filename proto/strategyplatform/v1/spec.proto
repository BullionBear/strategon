syntax = "proto3";

package strategyplatform.v1;

option go_package = "github.com/bullionbear/strategon/gen/strategyplatform/v1;strategyplatformv1";

import "google/protobuf/timestamp.proto";
import "strategyplatform/v1/common.proto";

// StrategyAssignmentSpec is a single strategy the control plane wants on a
// machine. Presence means the deployment is durable; stopped controls whether
// the process should be running. Only the control plane writes spec.
message StrategyAssignmentSpec {
  string strategy = 1; // logical strategy id
  ArtifactRef artifact = 2; // desired binary/image version
  ArtifactRef config = 3; // desired config version (config is an artifact too)
  ExecutionDriver driver = 4;
  ResourceLimits limits = 5;
  DeployPolicy deploy_policy = 6;
  LeaseSpec lease = 7;
  repeated CronSchedule schedules = 8;
  repeated string args = 9;
  map<string, string> env = 10;
  // When true the agent drains the process but retains WorkDir, release, and
  // status so logs/history remain browsable. Default false = should be running.
  bool stopped = 11;
  // Optional readiness probe. Presence turns the health window into a deadline:
  // expiry without Ready=TRUE rolls back (if enabled) or fails — never promotes
  // to HEALTHY. Specs without a probe keep today's grace-period behaviour.
  ReadinessProbe readiness = 12;
  // Named machine volumes to expose to this process. container_path is
  // always required (including EXEC-only assignments) so one manifest
  // validates for both drivers. EXEC ignores container_path at start;
  // OCI bind-mounts <base>/volumes/<name> there.
  repeated VolumeMount volume_mounts = 13;
}

// VolumeMount references a machine-level volume by name.
message VolumeMount {
  string name = 1;            // after CP expand: a real volume name
  string container_path = 2;  // always required; EXEC ignores at start
}

// ReadinessProbe is an HTTP URL or unix socket path the agent probes for Ready.
message ReadinessProbe {
  // http://127.0.0.1:8222/healthz, or a filesystem path for a unix socket
  // that serves HTTP /healthz (same as the existing UnixSocketChecker).
  string endpoint = 1;
}

// SharedFileSpec is one machine-level shared file. name is the on-disk basename
// under <base>/shared; artifact is content-addressed (same trust chain as
// binary/config). Shared files are machine-scoped: they are NOT part of any
// deployment's generation and are updated independently.
message SharedFileSpec {
  string name = 1;          // clean basename, e.g. "instruments.json"
  ArtifactRef artifact = 2; // content-addressed; agent re-verifies digest
}

// MachineSharedSpec is the full set of shared files desired on a machine. Like
// assignments, it is a FULL list, not incremental: the agent diffs it against
// local actual state and converges (adds missing, updates changed, GCs removed).
message MachineSharedSpec {
  repeated SharedFileSpec files = 1;
  int64 generation = 2; // bumps when any file's ref changes; independent of assignment generations
}

// DesiredState is the machine-level full snapshot pushed southbound. assignments
// is a FULL list (not incremental): the agent diffs it against local actual
// state. This full semantics makes reconnect/restart/loss degenerate into "take
// the latest snapshot and converge once", idempotent and order-independent.
message DesiredState {
  int64 generation = 1; // monotonically increasing snapshot version
  repeated StrategyAssignmentSpec assignments = 2; // full, not incremental
  int32 desired_agent_version = 3; // target agent version for self-update canary
  google.protobuf.Timestamp issued_at = 4;
  MachineSharedSpec shared = 5; // machine-level shared files (full snapshot)
  // Machine-level named volumes. Presence is load-bearing: unset (nil)
  // means "do not touch disk" (old CP); empty list means desired is empty.
  MachineVolumeSpec volumes = 6;
}

// VolumeSpec is one named directory under <base>/volumes/<name>.
message VolumeSpec {
  string name = 1; // clean basename
}

// MachineVolumeSpec is the desired volume inventory on a machine.
// Incremental human RPCs (CreateVolume / DeleteVolume) write this set;
// the agent converges when the message is present.
message MachineVolumeSpec {
  repeated VolumeSpec volumes = 1;
  int64 generation = 2;
}
