syntax = "proto3";

package strategyplatform.v1;

option go_package = "github.com/bullionbear/strategon/gen/strategyplatform/v1;strategyplatformv1";

import "strategyplatform/v1/common.proto";

// NatsCluster is a control-plane object. Apply persists spec only; a
// controller writes the per-machine assignments over time.
message NatsCluster {
  ObjectMeta metadata = 1;
  NatsClusterSpec spec = 2;
  NatsClusterStatus status = 3;
}

message NatsClusterSpec {
  string artifact_version = 1;
  string config_version = 2;
  // Strategy name owned by this cluster. Default "nats".
  string strategy = 3;
  repeated NatsServer servers = 4;
  NatsClusterUpdate update = 5;
}

message NatsServer {
  string machine = 1;
  string server_name = 2;
  // Address other members use in --routes. Required; do not guess hostname.
  string route_host = 3;
  int32 client_port = 4;  // default 4222
  int32 cluster_port = 5; // default 6222
  int32 monitor_port = 6; // default 8222
}

message NatsClusterUpdate {
  int32 max_unavailable = 1;    // must be >= 1
  int32 wait_ready_seconds = 2; // controller deadline per in-flight node
}

message NatsClusterStatus {
  // Pending | Rolling | Ready | Degraded | Failed | Deleting
  string phase = 1;
  int64 observed_generation = 2;
  string reason = 3;
  string message = 4;
  repeated NatsServerStatus servers = 5;
  bool deleting = 6;
}

message NatsServerStatus {
  string machine = 1;
  string server_name = 2;
  bool ready = 3;
  string phase = 4;
  bool converged = 5;
}

message ApplyNatsClusterRequest {
  NatsCluster cluster = 1;
}

message ApplyNatsClusterResponse {
  NatsCluster cluster = 1;
}

message GetNatsClusterRequest {
  string name = 1;
}

message ListNatsClustersRequest {}

message ListNatsClustersResponse {
  repeated NatsCluster clusters = 1;
}

message DeleteNatsClusterRequest {
  string name = 1;
}

message DeleteNatsClusterResponse {}
