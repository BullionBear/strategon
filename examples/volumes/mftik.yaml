# Machine-level volume + assignment mount. Create the volume first (this
# document) or `strategon volume create m1 mftik-data`. Mounts do not
# auto-create. ${VOLUME:mftik-data} expands to /var/lib/mftik on OCI and
# to the host VolumeDir on EXEC (including auto-rollback to a previous BINARY).
apiVersion: strategyplatform.v1
kind: MachineVolumes
metadata:
  name: m1
spec:
  volumes:
    - name: mftik-data
---
apiVersion: strategyplatform.v1
kind: StrategyAssignment
metadata:
  name: mftik
spec:
  machineId: m1
  artifact: mftik
  artifactVersion: v1
  volumeMounts:
    - { name: mftik-data, containerPath: /var/lib/mftik }
  env:
    MFTIK_DATA: "${VOLUME:mftik-data}"
    STS_EVENTLOG_DIR: "${VOLUME:mftik-data}"
---
# One-host AssignmentSet: expand innermost-first so
# ${VOLUME:${member.name}-data} reaches the agent as ${VOLUME:nats-a-data}.
# Create nats-a-data / nats-b-data on m1 before the controller writes members.
apiVersion: strategyplatform.v1
kind: AssignmentSet
metadata:
  name: mftik-lab
spec:
  strategy: mftik
  artifactVersion: v1
  update:
    maxUnavailable: 1
    waitReadySeconds: 60
  template:
    volumeMounts:
      - { name: "${member.name}-data", containerPath: /var/lib/mftik }
    env:
      MFTIK_DATA: "${VOLUME:${member.name}-data}"
    deployPolicy:
      startsecs: 2
      healthWindowSeconds: 30
      maxCrashesInWindow: 3
      stopGraceSeconds: 10
      enableAutoRollback: true
  members:
    - { machine: m1, name: nats-a }
    - { machine: m1, name: nats-b }
