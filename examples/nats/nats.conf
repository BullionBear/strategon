# Member config for a Strategon-managed NATS cluster.
#
# Do not add a `routes:` list here. NATS cannot expand an environment
# variable into a config array, so the controller injects peers on the
# command line as:
#
#   --routes nats://<peer>:6222,nats://<other>:6222
#
# which cluster.yaml expresses as template.peers.format.
#
# `$VAR` substitution below is evaluated by NATS at process start from
# the env the AssignmentSet template writes. The names are chosen in
# cluster.yaml, not by the control plane — nothing in Strategon knows what
# NATS_SERVER_NAME means.
#
# The agent readiness probe is http://127.0.0.1:<monitorPort>/healthz
# (NATS serves /healthz on http_port).

port: $NATS_CLIENT_PORT
http_port: $NATS_MONITOR_PORT
server_name: $NATS_SERVER_NAME

cluster {
  name: $NATS_CLUSTER_NAME
  port: $NATS_CLUSTER_PORT
}
